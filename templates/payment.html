<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment - Passlite</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            margin: 0;
        }

        .header {
            background: #123c69;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 550px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h2 {
            color: #123c69;
            text-align: center;
        }

        .row {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .amount {
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            margin: 25px 0;
        }

        .status {
            text-align: center;
            font-weight: bold;
            color: #c67c00;
        }

        .button {
            display: block;
            text-align: center;
            background: #123c69;
            color: white;
            padding: 14px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 25px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #123c69;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>PASSLITE INSIGHTS ACADEMY</h1>
    <p>Digital Report Card System</p>
</div>

<div class="container">

    <div class="card">

        <h2>Payment Summary</h2>

        <div class="row">
            <strong>Order ID</strong>
            <span>#{{ order.id }}</span>
        </div>

        <div class="row">
            <strong>Product</strong>
            <span>{{ order.product }}</span>
        </div>

        <div class="amount">
            ₦{{ "{:,}".format(order.amount) }}
        </div>

        <div class="status">
            Payment Status: {{ order.status }}
        </div>

        <a href="#" class="button">
            Proceed with Payment
        </a>

        <a href="/dashboard" class="back">
            ← Back to Dashboard
        </a>

    </div>

</div>

</body>

</html>
