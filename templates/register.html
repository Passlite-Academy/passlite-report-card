<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Passlite</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 500px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #123c69;
            font-size: 22px;
            margin-bottom: 5px;
        }

        h2 {
            text-align: center;
            color: #333;
            font-size: 16px;
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
            font-size: 13px;
            color: #1e293b;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
            font-size: 13px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #123c69;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0b2948;
        }

        .login {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
        }

        .login a {
            color: #123c69;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>PASSLITE INSIGHTS ACADEMY</h1>
    <h2>Create Your Account</h2>

    <form method="POST" action="/register">

        <label>Username</label>
        <input
            type="text"
            name="username"
            placeholder="Choose a username"
            required
        >

        <label>School Name</label>
        <input
            type="text"
            name="school_name"
            placeholder="Enter school name"
            required
        >

        <label>Email Address</label>
        <input
            type="email"
            name="email"
            placeholder="Enter email address"
            required
        >

        <label>Phone Number</label>
        <input
            type="tel"
            name="phone"
            placeholder="Enter phone number"
            required
        >

        <label>Password</label>
        <input
            type="password"
            name="password"
            placeholder="Create a password"
            required
        >

        <button type="submit">
            CREATE ACCOUNT
        </button>

    </form>

    <div class="login">
        Already have an account? <a href="/login">Login here</a>
    </div>

</div>

</body>

</html>
