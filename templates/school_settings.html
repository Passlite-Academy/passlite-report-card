<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>School Settings - Report Card System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: Arial, sans-serif; }
        .settings-container { max-width: 700px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 0 15px rgba(0,0,0,0.1); border-top: 4px solid #0d6efd; }
        .current-logo { max-height: 70px; margin-top: 10px; border: 1px solid #ddd; padding: 5px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <div class="settings-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3>🏫 School Settings</h3>
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary btn-sm">Back to Dashboard</a>
        </div>

        <form method="POST" enctype="multipart/form-data">
            
            <!-- School Name -->
            <div class="mb-3">
                <label for="school_name" class="form-label fw-bold">School Name</label>
                <input type="text" class="form-control" id="school_name" name="school_name" value="{{ user.school_name if user.school_name else '' }}" placeholder="Enter full school name" required>
            </div>

            <!-- School Logo -->
            <div class="mb-3">
                <label for="logo" class="form-label fw-bold">School Logo</label>
                <input type="file" class="form-control" id="logo" name="logo" accept="image/*">
                {% if user.logo %}
                    <div class="mt-2">
                        <small class="text-muted d-block">Current Logo:</small>
                        <img src="{{ url_for('static', filename=user.logo) }}" alt="School Logo" class="current-logo">
                    </div>
                {% endif %}
            </div>

            <!-- School Address -->
            <div class="mb-3">
                <label for="address" class="form-label fw-bold">School Address</label>
                <input type="text" class="form-control" id="address" name="address" value="{{ user.address if user.address else '' }}" placeholder="Enter school street address, city">
            </div>

            <!-- School Motto -->
            <div class="mb-3">
                <label for="motto" class="form-label fw-bold">School Motto</label>
                <input type="text" class="form-control" id="motto" name="motto" value="{{ user.motto if user.motto else '' }}" placeholder="e.g. Knowledge, Integrity & Excellence">
            </div>

            <!-- Phone Number -->
            <div class="mb-3">
                <label for="phone" class="form-label fw-bold">Phone Number(s)</label>
                <input type="text" class="form-control" id="phone" name="phone" value="{{ user.phone if user.phone else '' }}" placeholder="e.g. +2348012345678 / +2348098765432">
            </div>

            <!-- Email Address -->
            <div class="mb-3">
                <label for="email" class="form-label fw-bold">Email Address</label>
                <input type="email" class="form-control" id="email" name="email" value="{{ user.email if user.email else '' }}" placeholder="e.g. school@example.com">
            </div>

            <hr class="my-4">
            <h5 class="mb-3 text-secondary">Session & Term Details (Printed on Report Card)</h5>

            <!-- Academic Session -->
            <div class="mb-3">
                <label for="academic_session" class="form-label fw-bold">Academic Session</label>
                <input type="text" class="form-control" id="academic_session" name="academic_session" value="{{ user.academic_session if user.academic_session else '' }}" placeholder="e.g. 2025/2026">
            </div>

            <!-- Current Term -->
            <div class="mb-3">
                <label for="current_term" class="form-label fw-bold">Current Term</label>
                <input type="text" class="form-control" id="current_term" name="current_term" value="{{ user.current_term if user.current_term else '' }}" placeholder="e.g. Third Term">
            </div>

            <!-- Vacation Date -->
            <div class="mb-3">
                <label for="vacation_date" class="form-label fw-bold">Vacation Date</label>
                <input type="text" class="form-control" id="vacation_date" name="vacation_date" value="{{ user.vacation_date if user.vacation_date else '' }}" placeholder="e.g. 24/07/2026 or 24th July, 2026">
            </div>

            <!-- Next Term Resumption Date -->
            <div class="mb-3">
                <label for="resumption_date" class="form-label fw-bold">Next Term Resumption Date</label>
                <input type="text" class="form-control" id="resumption_date" name="resumption_date" value="{{ user.resumption_date if user.resumption_date else '' }}" placeholder="e.g. 14/09/2026 or 14th September, 2026">
            </div>

            <!-- Submit Button -->
            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary btn-lg">Save Settings</button>
            </div>

        </form>
    </div>
</div>

</body>
</html>
