<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Result Checker - Passlite Insights</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
            margin: 20px;
        }
        h2 {
            color: #2c3e50;
            margin-top: 0;
            font-size: 24px;
            text-align: center;
            margin-bottom: 10px;
        }
        p.subtitle {
            color: #7f8c8d;
            font-size: 14px;
            text-align: center;
            margin-bottom: 25px;
            line-height: 1.4;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #34495e;
            font-weight: 600;
            font-size: 14px;
        }
        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.3s;
            background: #fff;
        }
        input[type="text"]:focus, select:focus {
            border-color: #3498db;
            outline: none;
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn-primary:hover {
            background-color: #2980b9;
        }
        .alert {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            font-size: 13px;
            text-align: center;
        }
        .alert-danger {
            background-color: #fadbd8;
            color: #c0392b;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Student Result Checker</h2>
        <p class="subtitle">Select your academic session, term, and enter your details to view your result.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-danger">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label>Roll / Admission Number</label>
                <input type="text" name="roll_number" placeholder="e.g. JSS101" required>
            </div>

            <div class="form-group">
                <label for="academic_session">Academic Session</label>
                <select name="academic_session" id="academic_session" required>
                    <option value="2026/2027">2026/2027 Academic Session</option>
                    <option value="2027/2028">2027/2028 Academic Session</option>
                    <option value="2028/2029">2028/2029 Academic Session</option>
                    <option value="2029/2030">2029/2030 Academic Session</option>
                    <option value="2030/2031">2030/2031 Academic Session</option>
                    <option value="2031/2032">2031/2032 Academic Session</option>
                    <option value="2032/2033">2032/2033 Academic Session</option>
                    <option value="2033/2034">2033/2034 Academic Session</option>
                    <option value="2034/2035">2034/2035 Academic Session</option>
                    <option value="2035/2036">2035/2036 Academic Session</option>
                    <option value="2036/2037">2036/2037 Academic Session</option>
                    <option value="2037/2038">2037/2038 Academic Session</option>
                    <option value="2038/2039">2038/2039 Academic Session</option>
                    <option value="2039/2040">2039/2040 Academic Session</option>
                    <option value="2040/2041">2040/2041 Academic Session</option>
                    <option value="2041/2042">2041/2042 Academic Session</option>
                    <option value="2042/2043">2042/2043 Academic Session</option>
                    <option value="2043/2044">2043/2044 Academic Session</option>
                    <option value="2044/2045">2044/2045 Academic Session</option>
                    <option value="2045/2046">2045/2046 Academic Session</option>
                </select>
            </div>

            <div class="form-group">
                <label for="current_term">Target Term</label>
                <select name="current_term" id="current_term" required>
                    <option value="First Term">First Term</option>
                    <option value="Second Term">Second Term</option>
                    <option value="Third Term">Third Term</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Password / Student Name (First name or Surname)</label>
                <input type="text" name="name_input" placeholder="e.g. Abibat or Saheed" required>
            </div>
            
            <button type="submit" class="btn-primary">View Result</button>
        </form>
    </div>
</body>
</html>
